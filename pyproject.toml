[project]
name = "bigdata-project"
version = "0.1.0"
description = "BigData project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "gdown>=6.0.0",
    "greenlet==3.2.5",
    "ipykernel>=7.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-chess>=1.999",
    "pyzmq==26.4.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "ruff>=0.15.12",
]
